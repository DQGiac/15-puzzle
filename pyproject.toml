[project]
name = "project-1-puzzle-15"
version = "0.1.0"
description = "15-Puzzle game with IDA* and A* solvers"
readme = "README.md"
authors = [
    { name = "Rainy", email = "truongvu360@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "pytest>=9.1.1",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
